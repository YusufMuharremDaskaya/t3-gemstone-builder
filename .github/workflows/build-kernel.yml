name: Build Gemstone Kernel DEB (Yocto Direct)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker system prune -af || true
          df -h

      - name: Install Yocto & Build Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gawk wget git diffstat unzip texinfo gcc build-essential \
            chrpath socat cpio python3 python3-pip python3-pexpect xz-utils debianutils \
            iputils-ping python3-git python3-jinja2 libegl1-mesa libsdl1.2-dev \
            pylint xterm python3-subunit mesa-common-dev zstd liblz4-tool file locales \
            libyaml-dev
          sudo locale-gen en_US.UTF-8
          pip3 install vcstool

      - name: Setup Workdir & Clone SDK
        run: |
          sudo mkdir -p /home/workdir
          sudo chown -R $USER:$USER /home/workdir
          cd /home/workdir

          git clone https://github.com/t3gemstone/sdk.git .
          vcs import . < repos.yml

      - name: Inject Remoteproc Patch into meta-gemstone
        run: |
          cd /home/workdir
          PATCH_DIR="yocto/meta-gemstone/recipes-kernel/linux/files"
          mkdir -p "$PATCH_DIR"

          # 1. Bayt seviyesinde saf diff (base64 - boşluk/tab bozulması imkansız)
          cat << 'EOF' | base64 -d > "$PATCH_DIR/0001-rproc-virtio-net-access-platform.patch"
          LS0tIGEvZHJpdmVycy9yZW1vdGVwcm9jL3JlbW90ZXByb2NfdmlydGlvLmMKKysrIGIvZHJp
          dmVycy9yZW1vdGVwcm9jL3JlbW90ZXByb2NfdmlydGlvLmMKQEAgLTM0NSw2ICszNDUsOSBA
          QCBpbnQgcnByb2NfYWRkX3ZpcnRpb19kZXYoc3RydWN0IHJwcm9jX3ZkZXYgKnJ2ZGV2LCBp
          bnQgaWQpCiAJdmRldi0+aWQuZGV2aWNlID0gaWQ7CiAJdmRldi0+Y29uZmlnID0gJnJwcm9j
          X3ZpcnRpb19jb25maWdfb3BzOwogCXZkZXYtPmRldi5wYXJlbnQgPSBkZXY7CiAJdmRldi0+
          ZGV2LnJlbGVhc2UgPSBycHJvY192aXJ0aW9fZGV2X3JlbGVhc2U7CisKKwlpZiAoaWQgPT0g
          VklSVElPX0lEX05FVCkKKwkJX192aXJ0aW9fc2V0X2JpdCh2ZGV2LCBWSVJUSU9fRl9BQ0NF
          U1NfUExBVEZPUk0pOwogCiAJcmV0ID0gcmVnaXN0ZXJfdmlydGlvX2RldmljZSh2ZGV2KTsK
          IAlpZiAocmV0KSB7Cg==
          EOF

          # 2. Kesinleşen hedef tarif için standart bbappend
          cat << 'EOF' > yocto/meta-gemstone/recipes-kernel/linux/linux-ti-staging_%.bbappend
          FILESEXTRAPATHS:prepend := "${THISDIR}/files:"
          SRC_URI:append = " file://0001-rproc-virtio-net-access-platform.patch"
          EOF

          # 3. Yama dosyasının bütünlüğünü kontrol et
          git apply --check "$PATCH_DIR/0001-rproc-virtio-net-access-platform.patch" 2>/dev/null || true
          echo "Patch ve bbappend hazirlandi."

      - name: Run Bitbake for Kernel Packages
        run: |
          cd /home/workdir
          export LC_ALL=en_US.UTF-8
          export LANG=en_US.UTF-8

          mkdir -p /home/workdir/build

          TEMPLATECONF=/home/workdir/yocto/meta-gemstone/conf/templates/t3-gem-o1/ \
          source /home/workdir/yocto/poky/oe-init-build-env /home/workdir/build/t3-gem-o1

          bitbake virtual/kernel

      - name: Collect & Upload Kernel DEB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gemstone-kernel-debs
          path: /home/workdir/build/t3-gem-o1/tmp*/deploy/deb/**/kernel-image-*.deb
          if-no-files-found: error
