name: Build Gemstone Kernel DEB (Yocto Direct)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker system prune -af || true
          df -h

      - name: Install Yocto & Build Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gawk wget git diffstat unzip texinfo gcc build-essential \
            chrpath socat cpio python3 python3-pip python3-pexpect xz-utils debianutils \
            iputils-ping python3-git python3-jinja2 libegl1-mesa libsdl1.2-dev \
            pylint xterm python3-subunit mesa-common-dev zstd liblz4-tool file locales \
            libyaml-dev
          sudo locale-gen en_US.UTF-8
          pip3 install vcstool

      - name: Clone SDK & Fetch Repos
        run: |
          git clone https://github.com/t3gemstone/sdk.git
          cd sdk
          vcs import . < repos.yml

      - name: Inject Remoteproc Patch into meta-gemstone
        run: |
          cd sdk
          PATCH_DIR="yocto/meta-gemstone/recipes-kernel/linux/files"
          mkdir -p "$PATCH_DIR"

          # 1. Yamayı oluştur
          cat << 'EOF' > "$PATCH_DIR/0001-rproc-virtio-net-access-platform.patch"
          --- a/drivers/remoteproc/remoteproc_virtio.c
          +++ b/drivers/remoteproc/remoteproc_virtio.c
          @@ -345,6 +345,9 @@ int rproc_add_virtio_dev(struct rproc_vdev *rvdev, int id)
           	vdev->id.device = id;
           	vdev->config = &rproc_virtio_config_ops;
           	vdev->dev.parent = dev;
           	vdev->dev.release = rproc_virtio_dev_release;
           
          +	if (id == VIRTIO_ID_NET)
          +		__virtio_set_bit(vdev, VIRTIO_F_ACCESS_PLATFORM);
          +
           	ret = register_virtio_device(vdev);
          EOF

          # 2. meta-gemstone altına doğrudan joker bir bbappend yaz (bütün linux tariflerini yakalar)
          cat << 'EOF' > yocto/meta-gemstone/recipes-kernel/linux/linux-%.bbappend
          FILESEXTRAPATHS:prepend := "${THISDIR}/files:"
          SRC_URI:append = " file://0001-rproc-virtio-net-access-platform.patch"
          EOF

          echo "linux-%.bbappend başarıyla oluşturuldu:"
          cat yocto/meta-gemstone/recipes-kernel/linux/linux-%.bbappend

      - name: Run Bitbake for Kernel Packages
        run: |
          cd sdk
          export LC_ALL=en_US.UTF-8
          export LANG=en_US.UTF-8

          # Eksik olan build dizinini önceden oluştur
          mkdir -p build/t3-gem-o1

          # Yocto ortamını başlat ve doğrudan virtual/kernel derle
          TEMPLATECONF=$PWD/yocto/meta-gemstone/conf/templates/t3-gem-o1/ \
          source $PWD/yocto/poky/oe-init-build-env $PWD/build/t3-gem-o1

          bitbake virtual/kernel

      - name: Collect & Upload Kernel DEB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gemstone-kernel-debs
          path: sdk/build/t3-gem-o1/tmp*/deploy/deb/**/kernel-image-*.deb
          if-no-files-found: error
