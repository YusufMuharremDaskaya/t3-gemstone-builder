name: Build Gemstone Kernel DEB (Yocto Direct)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker system prune -af || true
          df -h

      - name: Install Yocto & Build Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gawk wget git diffstat unzip texinfo gcc build-essential \
            chrpath socat cpio python3 python3-pip python3-pexpect xz-utils debianutils \
            iputils-ping python3-git python3-jinja2 libegl1-mesa libsdl1.2-dev \
            pylint xterm python3-subunit mesa-common-dev zstd liblz4-tool file locales \
            libyaml-dev
          sudo locale-gen en_US.UTF-8
          pip3 install vcstool

      - name: Setup Workdir & Clone SDK
        run: |
          sudo mkdir -p /home/workdir
          sudo chown -R $USER:$USER /home/workdir
          cd /home/workdir

          git clone https://github.com/t3gemstone/sdk.git .
          vcs import . < repos.yml

      - name: Inject Remoteproc Hook into meta-gemstone
        run: |
          cd /home/workdir

          # Sadece gerçek kernel tarifinde çalışan güvenli python enjeksiyonu
          cat << 'EOF' > yocto/meta-gemstone/recipes-kernel/linux/linux-%.bbappend
          do_patch:append() {
              if [ "${PN}" != "linux-libc-headers" ]; then
                  TARGET="${S}/drivers/remoteproc/remoteproc_virtio.c"
                  if [ -f "$TARGET" ]; then
                      python3 -c '
          with open("'$TARGET'", "r") as f:
              content = f.read()

          target_str = "ret = register_virtio_device(vdev);"
          patch_str = "if (id == VIRTIO_ID_NET)\n\t\t__virtio_set_bit(vdev, VIRTIO_F_ACCESS_PLATFORM);\n\n\tret = register_virtio_device(vdev);"

          if "VIRTIO_F_ACCESS_PLATFORM" not in content:
              if target_str in content:
                  content = content.replace(target_str, patch_str, 1)
                  with open("'$TARGET'", "w") as f:
                      f.write(content)
                  print("VIRTIO_F_ACCESS_PLATFORM basariyla enjekte edildi.")
              else:
                  print("Hata: register_virtio_device satiri bulunamadi!")
                  exit(1)
          '
                  fi
              fi
          }
          EOF

          echo "linux-%.bbappend içeriği doğrulandı:"
          cat yocto/meta-gemstone/recipes-kernel/linux/linux-%.bbappend

      - name: Run Bitbake for Kernel Packages
        run: |
          cd /home/workdir
          export LC_ALL=en_US.UTF-8
          export LANG=en_US.UTF-8

          mkdir -p /home/workdir/build

          TEMPLATECONF=/home/workdir/yocto/meta-gemstone/conf/templates/t3-gem-o1/ \
          source /home/workdir/yocto/poky/oe-init-build-env /home/workdir/build/t3-gem-o1

          bitbake virtual/kernel

      - name: Collect & Upload Kernel DEB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gemstone-kernel-debs
          path: /home/workdir/build/t3-gem-o1/tmp*/deploy/deb/**/kernel-image-*.deb
          if-no-files-found: error
