name: Build Gemstone Kernel DEB (Yocto Direct)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker system prune -af || true
          df -h

      - name: Install Yocto & Build Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gawk wget git diffstat unzip texinfo gcc build-essential \
            chrpath socat cpio python3 python3-pip python3-pexpect xz-utils debianutils \
            iputils-ping python3-git python3-jinja2 libegl1-mesa libsdl1.2-dev \
            pylint xterm python3-subunit mesa-common-dev zstd liblz4-tool file locales \
            libyaml-dev
          sudo locale-gen en_US.UTF-8
          pip3 install vcstool

      - name: Setup Workdir & Clone SDK
        run: |
          sudo mkdir -p /home/workdir
          sudo chown -R $USER:$USER /home/workdir
          cd /home/workdir

          git clone https://github.com/t3gemstone/sdk.git .
          vcs import . < repos.yml

      - name: Inject Remoteproc Hook into meta-gemstone
        run: |
          cd /home/workdir

          # 1. Dosyayı güvenli bir şekilde yamalayacak harici bash scripti
          cat << 'EOF' > /home/workdir/patch_virtio.sh
          #!/usr/bin/env bash
          TARGET="$1/drivers/remoteproc/remoteproc_virtio.c"

          if [ -f "$TARGET" ]; then
              if ! grep -q "VIRTIO_F_ACCESS_PLATFORM" "$TARGET"; then
                  sed -i '/ret = register_virtio_device(vdev);/i \	if (id == VIRTIO_ID_NET)\n\t\t__virtio_set_bit(vdev, VIRTIO_F_ACCESS_PLATFORM);\n' "$TARGET"
                  echo ">>> VIRTIO_F_ACCESS_PLATFORM basariyla eklendi: $TARGET"
              fi
          fi
          EOF
          chmod +x /home/workdir/patch_virtio.sh

          # 2. Sadece gerçek kernel tariflerini hedefleyen temiz bbappend dosyaları
          mkdir -p yocto/meta-gemstone/recipes-kernel/linux
          cat << 'EOF' > yocto/meta-gemstone/recipes-kernel/linux/linux-ti-staging_%.bbappend
          do_patch:append() {
              /home/workdir/patch_virtio.sh "${S}"
          }
          EOF

          cp yocto/meta-gemstone/recipes-kernel/linux/linux-ti-staging_%.bbappend \
             yocto/meta-gemstone/recipes-kernel/linux/linux-t3-gem-o1_%.bbappend 2>/dev/null || true

          echo "Kernel bbappend dosyalari olusturuldu."

      - name: Run Bitbake for Kernel Packages
        run: |
          cd /home/workdir
          export LC_ALL=en_US.UTF-8
          export LANG=en_US.UTF-8

          mkdir -p /home/workdir/build

          TEMPLATECONF=/home/workdir/yocto/meta-gemstone/conf/templates/t3-gem-o1/ \
          source /home/workdir/yocto/poky/oe-init-build-env /home/workdir/build/t3-gem-o1

          bitbake virtual/kernel

      - name: Collect & Upload Kernel DEB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gemstone-kernel-debs
          path: /home/workdir/build/t3-gem-o1/tmp*/deploy/deb/**/kernel-image-*.deb
          if-no-files-found: error
