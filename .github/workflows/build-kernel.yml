name: Build Gemstone Kernel DEB (Direct Fast Track)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install Toolchain & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            build-essential libncurses-dev bison flex libssl-dev libelf-dev \
            bc git rsync kmod cpio debhelper rsync

      - name: Clone TI Linux Kernel (6.6 LTS)
        run: |
          # TI'ın t3-gemstone için kullandığı 6.6 staging kernel ağacını shallow çek (hız için)
          git clone --depth 1 --branch ti-linux-6.6.y https://git.ti.com/git/ti-linux-kernel/ti-linux-kernel.git kernel
          cd kernel
          echo "Kernel sürümü ve commit:"
          git log -1 --oneline

      - name: Apply Remoteproc Patch
        run: |
          cd kernel
          TARGET="drivers/remoteproc/remoteproc_virtio.c"

          if [ ! -f "$TARGET" ]; then
            echo "Hata: $TARGET bulunamadi!"
            exit 1
          fi

          # VIRTIO_F_ACCESS_PLATFORM bayrağını C dosyasına doğrudan enjekte et
          sed -i '/ret = register_virtio_device(vdev);/i \	if (id == VIRTIO_ID_NET)\n\t\t__virtio_set_bit(vdev, VIRTIO_F_ACCESS_PLATFORM);\n' "$TARGET"

          # Doğrulama: diff çıktısını konsola bas
          echo "=== Yapılan Değişiklik ==="
          git diff "$TARGET"

          if ! grep -q "VIRTIO_F_ACCESS_PLATFORM" "$TARGET"; then
            echo "Hata: Yama uygulanamadi!"
            exit 1
          fi

      - name: Configure & Compile Kernel Debian Packages
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          # TI K3 / AM62x mimarisinin standart defconfig'ini hazırla
          make defconfig

          # Kart ve sürüm karışıklığı olmasın diye yerel sürüm etiketi ekle
          scripts/config --set-str CONFIG_LOCALVERSION "-t3-gemstone"
          
          # Hızlı derleme için debug sembollerini kırp (paketi devasa boyutlardan kurtarır)
          scripts/config --disable CONFIG_DEBUG_INFO
          scripts/config --disable CONFIG_DEBUG_INFO_BTF
          scripts/config --disable CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT

          # Kernelin resmi Debian paketleyicisini çalıştır
          # bindeb-pkg: source deb yerine sadece binary deb paketlerini üretir (çok daha hızlıdır)
          make -j$(nproc) bindeb-pkg

      - name: List Generated Debian Packages
        run: |
          ls -lh *.deb

      - name: Upload Kernel DEB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gemstone-kernel-debs
          path: "*.deb"
          if-no-files-found: error
